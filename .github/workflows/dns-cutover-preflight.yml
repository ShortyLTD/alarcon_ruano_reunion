name: DNS cutover preflight

on:
  pull_request:
    paths:
      - ".github/workflows/dns-cutover-preflight.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify-dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query Vercel authoritative nameservers
        shell: bash
        env:
          EXPECTED_DMARC: "v=DMARC1; p=quarantine; adkim=r; aspf=r; rua=mailto:dmarc_rua@onsecureserver.net;"
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          import shlex
          import subprocess
          import sys

          domain = "santacruzreunion.com"
          expected_dmarc = os.environ["EXPECTED_DMARC"]
          failures = []
          summary = ["# DNS cutover preflight", "",
                     "Read-only queries. This workflow does not change DNS or deployments.", "",
                     "| Nameserver | Record | Answers |",
                     "| --- | --- | --- |"]

          def query(name, record_type, server=None):
              command = ["dig"]
              if server:
                  command += ["@" + server, "+norecurse"]
              command += [name, record_type, "+time=5", "+tries=1"]
              print("$ " + shlex.join(command), flush=True)
              result = subprocess.run(command, text=True, capture_output=True, timeout=20)
              print(result.stdout, flush=True)
              if result.stderr:
                  print(result.stderr, flush=True)
              if result.returncode or "status: NOERROR" not in result.stdout:
                  failures.append("DNS query failed: " + shlex.join(command))
              if server:
                  flags = re.search(r"flags: ([^;]+);", result.stdout)
                  if not flags or "aa" not in flags.group(1).split():
                      failures.append(server + " did not return an authoritative response for " + name)
              answers = []
              for line in result.stdout.splitlines():
                  if not line or line.startswith(";"):
                      continue
                  fields = line.split(None, 4)
                  if len(fields) == 5 and fields[0].rstrip(".").lower() == name.lower() and fields[3] == record_type:
                      answers.append(fields[4])
              return answers

          current_ns = query(domain, "NS")
          summary += ["| Current delegation | NS | " + ", ".join(current_ns) + " |"]
          expected_ns = {"ns1.vercel-dns.com", "ns2.vercel-dns.com"}
          if {value.rstrip(".").lower() for value in current_ns} != expected_ns:
              failures.append("Public NS answers must contain only the two Vercel nameservers")
          public_dmarc = ["".join(shlex.split(value)) for value in query("_dmarc." + domain, "TXT")]
          if public_dmarc != [expected_dmarc]:
              failures.append("Public DMARC answer does not exactly match the requested record")
          summary.append("| Public DNS | _dmarc TXT | " + ", ".join(public_dmarc) + " |")

          trace_command = ["dig", "NS", domain, "+trace", "+time=5", "+tries=1"]
          print("$ " + shlex.join(trace_command), flush=True)
          trace = subprocess.run(trace_command, text=True, capture_output=True, timeout=60)
          print(trace.stdout, flush=True)
          if trace.stderr:
              print(trace.stderr, flush=True)
          traced_ns = set(re.findall(r"^santacruzreunion\.com\.\s+\d+\s+IN\s+NS\s+(\S+)", trace.stdout, re.MULTILINE))
          traced_ns = {value.rstrip(".").lower() for value in traced_ns}
          if trace.returncode or traced_ns != expected_ns:
              failures.append("DNS trace did not confirm Vercel-only delegation")
          summary.append("| DNS trace | NS | " + ", ".join(sorted(traced_ns)) + " |")

          for server in ("ns1.vercel-dns.com", "ns2.vercel-dns.com"):
              apex = query(domain, "A", server)
              www_cname = query("www." + domain, "CNAME", server)
              www_a = query("www." + domain, "A", server)
              dmarc = query("_dmarc." + domain, "TXT", server)
              for label, addresses in (("apex", apex), ("www", www_a)):
                  if not addresses:
                      failures.append(server + ": missing " + label + " A record")
                  for address in addresses:
                      try:
                          ipaddress.IPv4Address(address)
                      except ValueError:
                          failures.append(server + ": invalid " + label + " A record")
              decoded_dmarc = ["".join(shlex.split(value)) for value in dmarc]
              if decoded_dmarc != [expected_dmarc]:
                  failures.append(server + ": DMARC does not exactly match the requested single record")
              for label, values in (("apex A", apex), ("www CNAME", www_cname), ("www A", www_a), ("_dmarc TXT", decoded_dmarc)):
                  answer = ", ".join(values) or "(no CNAME returned; www A checked separately)"
                  summary.append("| " + server + " | " + label + " | " + answer + " |")

          summary += ["", "Result: " + ("FAIL" if failures else "PASS")]
          summary += ["- " + failure for failure in failures]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(summary) + "\n")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("PASS: both Vercel nameservers answer authoritatively for apex, www, and the exact DMARC record.")
          PY
